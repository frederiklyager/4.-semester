name: Security & Quality Pipeline

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]

jobs:
  # =============================================================================
  # JOB 1: CODE QUALITY & LINTING
  # =============================================================================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 black isort mypy
        
    - name: Run Black (code formatting)
      run: black --check src/ tests/ || true
      continue-on-error: true
    
    - name: Run isort (import sorting)
      run: isort --check-only src/ tests/ || true
      continue-on-error: true
    
    - name: Run Flake8 (linting)
      run: flake8 src/ tests/ --max-line-length=120 --ignore=E203,W503 || true
      continue-on-error: true

  # =============================================================================
  # JOB 2: SECURITY SCANNING
  # =============================================================================
  security-scan:
    name: Security Vulnerability Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install safety bandit
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Run Safety (dependency vulnerabilities)
      run: safety check || true
      continue-on-error: true
    
    - name: Run Bandit (security issues in code)
      run: bandit -r src/ -f json || true
      continue-on-error: true

  # =============================================================================
  # JOB 3: UNIT TESTS & COVERAGE
  # =============================================================================
  unit-tests:
    name: Unit Tests & Coverage
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-cov pytest-mock
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: Run pytest with coverage
      run: |
        pytest tests/ -v --cov=src --cov-report=xml --cov-report=term || true
      continue-on-error: true

  # =============================================================================
  # JOB 4: SECURITY POLICY CHECK
  # =============================================================================
  security-policy:
    name: Security Policy Compliance
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Check for .env in repo (CRITICAL)
      run: |
        if [ -f .env ]; then
          echo "❌ CRITICAL: .env file found in repository!"
          exit 1
        else
          echo "✅ No .env file in repository"
        fi
    
    - name: Check for .gitignore
      run: |
        if [ ! -f .gitignore ]; then
          echo "⚠️ WARNING: No .gitignore file found"
          exit 1
        fi
        if ! grep -q ".env" .gitignore; then
          echo "⚠️ WARNING: .env not in .gitignore"
          exit 1
        fi
        echo "✅ .gitignore properly configured"

  # =============================================================================
  # JOB 5: BUILD SUCCESS NOTIFICATION
  # =============================================================================
  build-summary:
    name: Build Summary
    runs-on: ubuntu-latest
    needs: [code-quality, security-scan, unit-tests, security-policy]
    if: always()
    
    steps:
    - name: Check build status
      run: |
        echo "==================================="
        echo "BUILD SUMMARY"
        echo "==================================="
        echo "Code Quality: ${{ needs.code-quality.result }}"
        echo "Security Scan: ${{ needs.security-scan.result }}"
        echo "Unit Tests: ${{ needs.unit-tests.result }}"
        echo "Security Policy: ${{ needs.security-policy.result }}"
        echo "==================================="
        
        if [ "${{ needs.security-policy.result }}" == "failure" ]; then
          echo "❌ CRITICAL SECURITY ISSUE DETECTED!"
          exit 1
        fi
        
        echo "✅ All critical checks passed!"
```

---

## ✅ **Step 3: Verify Structure**

Your project should now have:
```
.github/
└── workflows/
    └── security.yml